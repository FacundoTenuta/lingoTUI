schema: spec-driven
project: lingotui
artifact_store:
  mode: hybrid
  openspec: true
  engram: true

context: |
  Repository contains planning documents plus the PR 1 Go module scaffold, app ports, config/credential stores, command parser, fakes, and unit tests.
  Planned stack from TECHNICAL_DESIGN.md: Go, Bubble Tea, Lip Gloss, ffmpeg, provider abstraction, OpenAI first.
  Go unit tests are available through `go test ./...`; gofmt is the formatter. No CI or linter is present yet.
  Architecture direction: TUI -> command router -> use cases -> ports/interfaces -> adapters.
  Privacy defaults: explicit recording, temporary audio, in-memory transcript/summary by default.

strict_tdd: false

testing:
  detected: 2026-06-01
  strict_tdd: false
  reason: Strict TDD remains disabled for this change, but PR 1 created a Go module and unit test harness.
  runner:
    framework: go test
    command: "go test ./..."
  layers:
    unit:
      available: true
      tool: go test
    integration:
      available: false
      tool: ""
    e2e:
      available: false
      tool: ""
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: false
      command: ""
    type_checker:
      available: false
      command: ""
    formatter:
      available: true
      command: gofmt

rules:
  proposal:
    - Include privacy and provider-cost impact for audio, transcription, and chat changes.
    - Keep MVP scope focused on macOS microphone capture before system audio.
  specs:
    - Use Given/When/Then scenarios.
    - Use RFC 2119 keywords: MUST, SHALL, SHOULD, MAY.
    - Separate product behavior from provider-specific implementation details.
  design:
    - Preserve the port/adapter boundary: TUI and use cases must not depend on provider or audio implementation details.
    - Document credential-storage and privacy tradeoffs before implementation.
  tasks:
    - Group work into reviewable slices under 400 changed lines when practical.
    - Ask before planning chained PRs.
  apply:
    tdd: false
    test_command: "go test ./..."
    guidance:
      - Once a Go module exists, prefer adding tests for command parsing, use cases, provider seams, and TUI state before feature code.
  verify:
    test_command: "go test ./..."
    build_command: "go test ./..."
    coverage_threshold: 0
    guidance:
      - Verify the Go scaffold with gofmt and go test; continue checking SDD artifact consistency.
  archive:
    - Warn before merging destructive or privacy-impacting spec changes.
